name: Daily Reminders Automation

on:
  schedule:
    # רץ כל 30 דקות. השרת בודק איזו התראה הגיעה שעתה (לפי שעון ישראל ושעות
    # שהוגדרו באפליקציה) ושולח כל התראה פעם אחת ביום. GitHub עשוי לאחר ריצות בכמה דקות.
    - cron: "*/30 * * * *"
  workflow_dispatch: {} # מאפשר גם הפעלה ידנית מטאב Actions ב-GitHub

jobs:
  trigger-daily-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Call daily reminders endpoint
        run: |
          # מדפיס את תשובת השרת (כמה התראות נשלחו) ונכשל אם הסטטוס אינו 2xx, כדי שיהיה אפשר לאבחן
          code=$(curl -s -o response.json -w "%{http_code}" -X POST "${{ secrets.APP_URL }}/api/cron/daily-reminders" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "HTTP $code"
          cat response.json
          echo
          [ "$code" -ge 200 ] && [ "$code" -lt 300 ]
